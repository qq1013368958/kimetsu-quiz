  * { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  background: #0a0505;
  color: #e8e8e8;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  position: relative;
  overflow-x: hidden;
}

/* 火焰橙红背景 */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at 50% 110%, rgba(255, 90, 30, 0.55), transparent 55%),
    radial-gradient(circle at 15% 90%, rgba(255, 140, 40, 0.35), transparent 50%),
    radial-gradient(circle at 85% 95%, rgba(255, 60, 20, 0.4), transparent 50%),
    radial-gradient(circle at 50% 0%, rgba(120, 20, 10, 0.5), transparent 60%),
    linear-gradient(180deg, #0a0202 0%, #1a0604 45%, #2a0a05 75%, #3a1006 100%);
  z-index: -2;
  animation: fireGlow 6s ease-in-out infinite;
}

/* 飘动的火星 */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  background-image:
    radial-gradient(2px 2px at 20% 80%, rgba(255, 180, 80, 0.9), transparent),
    radial-gradient(1.5px 1.5px at 40% 60%, rgba(255, 120, 40, 0.8), transparent),
    radial-gradient(2px 2px at 65% 75%, rgba(255, 200, 100, 0.85), transparent),
    radial-gradient(1.5px 1.5px at 80% 55%, rgba(255, 100, 30, 0.8), transparent),
    radial-gradient(1.5px 1.5px at 10% 50%, rgba(255, 160, 60, 0.7), transparent),
    radial-gradient(2px 2px at 90% 85%, rgba(255, 220, 120, 0.8), transparent);
  animation: emberFloat 9s ease-in-out infinite;
  z-index: -1;
}

@keyframes fireGlow {
  0%, 100% { opacity: 0.9; }
  50% { opacity: 1; }
}

@keyframes emberFloat {
  0%, 100% { transform: translateY(0); opacity: 0.7; }
  50% { transform: translateY(-20px); opacity: 1; }
}

  backdrop-filter: blur(8px);
  position: relative;
}

    margin-bottom: 24px;

  .hidden { display: none; }

// ============ 状态 ============
let scores = {};
let answers = [];   // 记录每题选了谁
let current = 0;

// 初始化所有角色分数为 0
Object.keys(RESULTS).forEach(function(k){ scores[k] = 0; });// ============ 授权码验证 ============
async function verifyCode() {
  const code = document.getElementById('codeInput').value.trim();
  const btn = document.getElementById('authBtn');
  const err = document.getElementById('authErr');
  if (!code) { err.textContent = '请输入授权码'; return; }
  btn.disabled = true;
  btn.textContent = '验证中...';
  err.textContent = '';
  try {
    const res = await fetch('/.netlify/functions/verify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code })
    });
    const data = await res.json();
    if (data.valid) {
      document.getElementById('authCard').classList.add('hidden');
      document.getElementById('quizCard').classList.remove('hidden');
      renderQuestion();
    } else {
      err.textContent = '授权码错误，请重新输入';
    }
  } catch (e) {
    err.textContent = '网络错误，请稍后再试';
  } finally {
    btn.disabled = false;
    btn.textContent = '开始测试 ⚔️';
  }
}

// ============ 渲染题目 ============
function renderQuestion() {
  const q = QUESTIONS[current];
  document.getElementById('progressText').textContent = '第 ' + (current + 1) + ' / ' + QUESTIONS.length + ' 题';
  const percent = Math.round(((current) / QUESTIONS.length) * 100);
  document.getElementById('progressPercent').textContent = percent + '%';
  document.getElementById('progressFill').style.width = percent + '%';
  document.getElementById('question').textContent = q.q;

  const box = document.getElementById('options');
  box.innerHTML = '';
  q.a.forEach(function(item, idx) {
    const div = document.createElement('div');
    div.className = 'opt';
    div.textContent = item[0];
    // 如果这题已经答过，高亮之前的选择
    if (answers[current] === idx) {
      div.style.borderColor = '#c77dff';
      div.style.background = 'rgba(199,125,255,0.12)';
    }
    div.onclick = function() { choose(idx); };
    box.appendChild(div);
  });

  // 上一题按钮状态
  document.getElementById('prevBtn').disabled = (current === 0);
  // 下一题提示按钮
  const nextHint = document.getElementById('nextHint');
  if (answers[current] !== undefined) {
    nextHint.textContent = '下一题 →';
    nextHint.disabled = false;
    nextHint.onclick = nextQuestion;
  } else {
    nextHint.textContent = '选择答案后继续';
    nextHint.disabled = true;
    nextHint.onclick = null;
  }
}

// ============ 选择答案 ============
function choose(idx) {
  const q = QUESTIONS[current];
  const role = q.a[idx][1];

  // 如果这题之前答过，先撤销上一次的加分
  if (answers[current] !== undefined) {
    const prevRole = q.a[answers[current]][1];
    scores[prevRole]--;
  }

  scores[role]++;
  answers[current] = idx;

  // 高亮
  const opts = document.querySelectorAll('.opt');
  opts.forEach(function(el, i) {
    if (i === idx) {
      el.style.borderColor = '#c77dff';
      el.style.background = 'rgba(199,125,255,0.12)';
    } else {
      el.style.borderColor = 'rgba(160,100,220,0.25)';
      el.style.background = 'transparent';
    }
  });

  // 更新底部按钮
  const nextHint = document.getElementById('nextHint');
  nextHint.textContent = '下一题 →';
  nextHint.disabled = false;
  nextHint.onclick = nextQuestion;

  // 如果是最后一题，自动改为“查看结果”
  if (current === QUESTIONS.length - 1) {
    nextHint.textContent = '查看结果 🎉';
    nextHint.onclick = showResult;
  }
}

// ============ 上一题 / 下一题 ============
function prevQuestion() {
  if (current > 0) {
    current--;
    renderQuestion();
  }
}

function nextQuestion() {
  if (answers[current] === undefined) return;
  if (current < QUESTIONS.length - 1) {
    current++;
    renderQuestion();
  } else {
    showResult();
  }
}

// ============ 显示结果 ============
function showResult() {
  // 检查有没有漏题
  for (let i = 0; i < QUESTIONS.length; i++) {
    if (answers[i] === undefined) {
      current = i;
      renderQuestion();
      alert('还有题目没答哦，已跳到第 ' + (i + 1) + ' 题');
      return;
    }
  }

  // 找出得分最高的角色
  let top = 'tanjiro';
  let max = -1;
  Object.keys(scores).forEach(function(k) {
    if (scores[k] > max) { max = scores[k]; top = k; }
  });

  const r = RESULTS[top];

  document.getElementById('quizCard').classList.add('hidden');
  document.getElementById('resultCard').classList.remove('hidden');

  document.getElementById('resultEmoji').textContent = r.emoji;
  document.getElementById('resultTitle').textContent = r.title;
  document.getElementById('resultName').textContent = r.name;
  document.getElementById('resultQuote').textContent = r.quote;
  document.getElementById('resultProfile').textContent = r.profile;
  document.getElementById('resultLine').textContent = r.quote;
  document.getElementById('resultReal').textContent = r.real;
  document.getElementById('resultStory').textContent = r.story;

  // 六维：以角色 base 值 + 一点答题浮动
  const base = r.base;
  const fluctuate = function(v) {
    return Math.max(20, Math.min(99, v + Math.floor(Math.random() * 9) - 4));
  };
  const stats = [
    { label: '温柔', value: fluctuate(base.gentle) },
    { label: '热血', value: fluctuate(base.passion) },
    { label: '战斗力', value: fluctuate(base.power) },
    { label: '情绪稳定', value: fluctuate(base.stable) },
    { label: '心眼', value: fluctuate(base.mind) },
    { label: '行动力', value: fluctuate(base.action) }
  ];

  const statsBox = document.getElementById('statsBox');
  statsBox.innerHTML = '';
  stats.forEach(function(s) {
    const row = document.createElement('div');
    row.className = 'stat-row';
    row.innerHTML =
      '<div class="stat-label">' + s.label + '</div>' +
      '<div class="stat-bar"><div class="stat-fill" style="width:' + s.value + '%"></div></div>' +
      '<div class="stat-num">' + s.value + '</div>';
    statsBox.appendChild(row);
  });

  // 记录当前结果，供分享用
  window.__resultText = '我在《鬼灭之刃人物测试》里测出来是：' +
    r.emoji + ' ' + r.name + '（' + r.title + '）\n' +
    r.quote + '\n' +
    '你也来测测你是鬼灭里的谁？\n' +
    window.location.href;
}

// ============ 分享结果 ============
function shareResult() {
  const text = window.__resultText || '我在《鬼灭之刃人物测试》里测出了一个结果！';
  if (navigator.share) {
    navigator.share({ title: '鬼灭之刃人物测试', text: text }).catch(function(){});
  } else {
    navigator.clipboard.writeText(text).then(function() {
      alert('结果已复制到剪贴板，去粘贴给朋友吧！');
    }).catch(function() {
      alert('复制失败，请手动截图分享。');
    });
  }
}

// 回车直接验证
document.getElementById('codeInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') verifyCode();
});
